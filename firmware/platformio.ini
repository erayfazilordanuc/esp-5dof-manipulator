; =============================================================================
;  ArmPilot - 5 Eksen Robot Kol Kontrol Yazilimi
;  Hedef: ESP32 + PCA9685 (I2C) + 5x analog servo
; =============================================================================

[platformio]
name = ArmPilot
description = Gorsel (kinematik) web arayuzu ile 5 eksen robot kol kontrolcusu
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ ^6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; upload_port = COM6
; monitor_port = COM6

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    esp32async/AsyncTCP @ ^3.4.0
    esp32async/ESPAsyncWebServer @ ^3.7.0

; Arsivlenmis eski deneme dosyalari derlemeye girmez (legacy/ klasoru).
